<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Peel the Banana</title>
<style>
  :root {
    --peel-yellow: #f3d34a;
    --peel-yellow-dark: #e0b923;
    --fruit-cream: #f5edcb;
    --bg-top: #1b2a1c;
    --bg-bottom: #0c140d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    touch-action: none;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 480px;
    padding: 14px 18px 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    box-sizing: border-box;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header .stats {
    font-size: 0.95rem;
    opacity: 0.85;
    display: flex;
    gap: 14px;
  }
  #stage-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    touch-action: none;
    display: block;
  }
  #progress-bar {
    position: absolute;
    bottom: 14px;
    left: 18px;
    right: 18px;
    height: 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd23f, #ff8a3d);
    transition: width 0.12s ease-out;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    z-index: 20;
  }
  #overlay.show { display: flex; }
  .card {
    background: #1f2e20;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 28px 26px;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 1.4rem;
  }
  .card p {
    opacity: 0.8;
    margin: 0 0 18px;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .card .big-stat {
    font-size: 2.4rem;
    font-weight: 700;
    margin: 4px 0 2px;
    color: var(--peel-yellow);
  }
  button {
    background: linear-gradient(135deg, #ffd23f, #ffb627);
    color: #2a2206;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(255, 178, 39, 0.35);
  }
  button:active { transform: scale(0.97); }
  footer {
    padding: 8px 0 16px;
    font-size: 0.78rem;
    opacity: 0.5;
    text-align: center;
  }
  #hint {
    position: absolute;
    top: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85rem;
    opacity: 0.7;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍌 Peel the Banana</h1>
    <div class="stats">
      <span id="timer">0.0s</span>
      <span id="best">Best: --</span>
    </div>
  </header>
  <div id="stage-wrap">
    <div id="hint">Drag up each strip to peel it</div>
    <canvas id="stage"></canvas>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="overlay">
      <div class="card" id="card">
        <h2 id="card-title">Banana Peeled!</h2>
        <div class="big-stat" id="card-time">0.0s</div>
        <p id="card-sub">Nice and clean. Ready for another?</p>
        <button id="restart-btn">Peel Another</button>
      </div>
    </div>
  </div>
  <footer>Tip: peel all 4 strips before time runs out</footer>
</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var stageWrap = document.getElementById("stage-wrap");
  var timerEl = document.getElementById("timer");
  var bestEl = document.getElementById("best");
  var progressFill = document.getElementById("progress-fill");
  var overlay = document.getElementById("overlay");
  var cardTitle = document.getElementById("card-title");
  var cardTime = document.getElementById("card-time");
  var cardSub = document.getElementById("card-sub");
  var restartBtn = document.getElementById("restart-btn");
  var hint = document.getElementById("hint");

  var TIME_LIMIT = 20; // seconds
  var STRIP_COUNT = 4;
  var SAMPLES = 16; // centerline resolution
  var T_ATTACH = 0.0; // the root/stem end, at the bottom; every strip hinges from here

  var W = 0, H = 0, DPR = window.devicePixelRatio || 1;
  var cx = 0, cy = 0; // banana center
  var bananaW = 0, bananaH = 0, bowMag = 0;

  var strips = [];
  var dragging = null;
  var startTime = 0;
  var elapsed = 0;
  var finished = false;
  var rafId = null;

  var best = null;
  try {
    var saved = localStorage.getItem("banana_best_time");
    if (saved) best = parseFloat(saved);
  } catch (e) {}
  updateBestLabel();

  function resize() {
    var rect = stageWrap.getBoundingClientRect();
    W = Math.max(280, Math.floor(rect.width));
    H = Math.max(360, Math.floor(rect.height) - 30);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    cx = W / 2;
    cy = H / 2 + 10;
    bananaW = Math.min(W * 0.46, 160);
    bananaH = Math.min(H * 0.66, 380);
    bowMag = bananaW * 0.38;

    buildStrips();
    draw();
  }

  // ---- banana geometry: a bowed centerline with a tapered width profile ----
  // t=0 is the root/stem at the bottom, t=1 is the tip at the top
  function centerlinePoint(t) {
    return {
      x: cx + bowMag * Math.sin(Math.PI * t),
      y: cy + bananaH / 2 - t * bananaH
    };
  }

  function halfWidthAt(t) {
    return (bananaW / 2) * (0.32 + 0.68 * Math.sin(Math.PI * Math.pow(t, 0.92)));
  }

  function tangentAt(t) {
    var eps = 0.01;
    var t0 = Math.max(0, t - eps);
    var t1 = Math.min(1, t + eps);
    var p0 = centerlinePoint(t0);
    var p1 = centerlinePoint(t1);
    var dx = p1.x - p0.x, dy = p1.y - p0.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: dx / len, y: dy / len };
  }

  function normalAt(t) {
    var tan = tangentAt(t);
    return { x: -tan.y, y: tan.x };
  }

  function edgePoint(t, frac) {
    var c = centerlinePoint(t);
    var n = normalAt(t);
    var hw = halfWidthAt(t);
    return { x: c.x + n.x * hw * frac, y: c.y + n.y * hw * frac };
  }

  function buildStrips() {
    strips = [];
    for (var i = 0; i < STRIP_COUNT; i++) {
      var centered = i - (STRIP_COUNT - 1) / 2; // e.g. -1.5,-0.5,0.5,1.5
      var dirSign = centered < 0 ? -1 : 1;
      strips.push({
        index: i,
        leftFrac: -1 + (2 * i) / STRIP_COUNT,
        rightFrac: -1 + (2 * (i + 1)) / STRIP_COUNT,
        peelAmount: 0, // 0 = unpeeled, 1 = fully peeled
        peeled: false,
        dirSign: dirSign,
        angleMax: ((40 + 20 * Math.abs(centered)) * Math.PI) / 180
      });
    }
  }

  function rotatePoint(p, pivot, angle) {
    var s = Math.sin(angle), c = Math.cos(angle);
    var dx = p.x - pivot.x, dy = p.y - pivot.y;
    return {
      x: pivot.x + dx * c - dy * s,
      y: pivot.y + dx * s + dy * c
    };
  }

  // builds the strip's current on-screen polygon, accounting for how far it has peeled open
  function stripPolygon(strip) {
    var pts = [];
    var i, t;
    for (i = 0; i <= SAMPLES; i++) {
      t = T_ATTACH + (i / SAMPLES) * (1 - T_ATTACH);
      pts.push(edgePoint(t, strip.leftFrac));
    }
    for (i = SAMPLES; i >= 0; i--) {
      t = T_ATTACH + (i / SAMPLES) * (1 - T_ATTACH);
      pts.push(edgePoint(t, strip.rightFrac));
    }

    var angle = strip.peelAmount * strip.angleMax * strip.dirSign;
    var pivot = centerlinePoint(T_ATTACH);
    var dropY = strip.peelAmount * bananaH * 0.05;

    if (angle === 0 && dropY === 0) return pts;
    return pts.map(function (p) {
      var r = rotatePoint(p, pivot, angle);
      r.y += dropY;
      return r;
    });
  }

  // maps a screen point back into a strip's unrotated model space (t along
  // length, frac across width) by undoing the same transform used to draw it
  function localCoordsForStrip(strip, x, y) {
    var angle = strip.peelAmount * strip.angleMax * strip.dirSign;
    var pivot = centerlinePoint(T_ATTACH);
    var dropY = strip.peelAmount * bananaH * 0.05;
    var local = rotatePoint({ x: x, y: y - dropY }, pivot, -angle);

    var t = ((cy + bananaH / 2) - local.y) / bananaH;
    t = Math.max(0, Math.min(1, t));

    var c = centerlinePoint(t);
    var n = normalAt(t);
    var hw = halfWidthAt(t);
    var dx = local.x - c.x, dy = local.y - c.y;
    var frac = (dx * n.x + dy * n.y) / hw;
    return { t: t, frac: frac };
  }

  function getStripAt(x, y) {
    for (var i = strips.length - 1; i >= 0; i--) {
      var s = strips[i];
      if (s.peeled) continue;
      var lc = localCoordsForStrip(s, x, y);
      if (lc.frac >= s.leftFrac - 0.04 && lc.frac <= s.rightFrac + 0.04) return s;
    }
    return null;
  }

  function toLocal(evt) {
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (evt.touches && evt.touches.length) {
      clientX = evt.touches[0].clientX;
      clientY = evt.touches[0].clientY;
    } else if (evt.changedTouches && evt.changedTouches.length) {
      clientX = evt.changedTouches[0].clientX;
      clientY = evt.changedTouches[0].clientY;
    } else {
      clientX = evt.clientX;
      clientY = evt.clientY;
    }
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function onPointerDown(evt) {
    if (finished) return;
    var p = toLocal(evt);
    var strip = getStripAt(p.x, p.y);
    if (!strip) return;
    dragging = { strip: strip, lastY: p.y, startY: p.y };
    hint.style.opacity = "0";
    if (!startTime) {
      startTime = performance.now();
      loop();
    }
    evt.preventDefault();
  }

  function onPointerMove(evt) {
    if (!dragging || finished) return;
    var p = toLocal(evt);
    var dy = p.y - dragging.lastY;
    if (dy < 0) {
      var range = bananaH * 0.55;
      dragging.strip.peelAmount = Math.min(1, dragging.strip.peelAmount + (-dy) / range);
    }
    dragging.lastY = p.y;
    if (dragging.strip.peelAmount >= 1 && !dragging.strip.peeled) {
      dragging.strip.peeled = true;
      checkComplete();
    }
    draw();
    evt.preventDefault();
  }

  function onPointerUp(evt) {
    dragging = null;
  }

  function checkComplete() {
    var allDone = strips.every(function (s) { return s.peeled; });
    if (allDone && !finished) {
      finished = true;
      var finalTime = elapsed;
      setTimeout(function () { showResult(finalTime, true); }, 220);
    }
  }

  function loop() {
    if (finished) return;
    elapsed = (performance.now() - startTime) / 1000;
    if (elapsed >= TIME_LIMIT) {
      finished = true;
      showResult(TIME_LIMIT, false);
      draw();
      return;
    }
    timerEl.textContent = elapsed.toFixed(1) + "s";
    var totalProgress = strips.reduce(function (sum, s) { return sum + s.peelAmount; }, 0) / STRIP_COUNT;
    progressFill.style.width = (totalProgress * 100).toFixed(1) + "%";
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function showResult(time, success) {
    cancelAnimationFrame(rafId);
    timerEl.textContent = time.toFixed(1) + "s";
    if (success) {
      cardTitle.textContent = "Banana Peeled!";
      cardTime.textContent = time.toFixed(1) + "s";
      if (best === null || time < best) {
        best = time;
        try { localStorage.setItem("banana_best_time", String(best)); } catch (e) {}
        cardSub.textContent = "New best time!";
      } else {
        cardSub.textContent = "Nice and clean. Ready for another?";
      }
    } else {
      cardTitle.textContent = "Time's Up!";
      cardTime.textContent = Math.round(
        (strips.reduce(function (s, st) { return s + st.peelAmount; }, 0) / STRIP_COUNT) * 100
      ) + "%";
      cardSub.textContent = "That's how much you peeled. Try again?";
    }
    updateBestLabel();
    overlay.classList.add("show");
  }

  function updateBestLabel() {
    bestEl.textContent = "Best: " + (best !== null ? best.toFixed(1) + "s" : "--");
  }

  function resetGame() {
    finished = false;
    dragging = null;
    startTime = 0;
    elapsed = 0;
    timerEl.textContent = "0.0s";
    progressFill.style.width = "0%";
    overlay.classList.remove("show");
    hint.style.opacity = "0.7";
    buildStrips();
    draw();
  }

  restartBtn.addEventListener("click", resetGame);

  // ---- drawing ----
  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawGroundShadow();
    drawFruitCore();
    drawStrips();
    drawGloss();
    drawStem();
  }

  function drawGroundShadow() {
    var p = centerlinePoint(T_ATTACH);
    ctx.save();
    ctx.filter = "blur(10px)";
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 20, bananaW * 0.55, bananaH * 0.045, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawGloss() {
    ctx.save();
    pathFromPoints(buildOutlinePoints(1));
    ctx.clip();
    ctx.filter = "blur(7px)";
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    for (var i = 0; i <= SAMPLES; i++) {
      var t = i / SAMPLES;
      var p = edgeScaled(t, -0.4, 0.75);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 10;
    ctx.stroke();
    ctx.restore();
  }

  function buildOutlinePoints(scale) {
    var pts = [];
    var i, t;
    for (i = 0; i <= SAMPLES; i++) {
      t = i / SAMPLES;
      pts.push(edgeScaled(t, -1, scale));
    }
    for (i = SAMPLES; i >= 0; i--) {
      t = i / SAMPLES;
      pts.push(edgeScaled(t, 1, scale));
    }
    return pts;
  }

  function edgeScaled(t, frac, scale) {
    var c = centerlinePoint(t);
    var n = normalAt(t);
    var hw = halfWidthAt(t) * scale;
    return { x: c.x + n.x * hw * frac, y: c.y + n.y * hw * frac };
  }

  function pathFromPoints(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
  }

  function drawFruitCore() {
    ctx.save();
    var pts = buildOutlinePoints(0.86);
    pathFromPoints(pts);
    // cylindrical lighting: dark rim - bright highlight - mid tone - dark rim
    var grad = ctx.createLinearGradient(cx - bananaW / 2, cy, cx + bananaW / 2, cy);
    grad.addColorStop(0, "#cdbf8c");
    grad.addColorStop(0.32, "#fffae0");
    grad.addColorStop(0.55, "#f3ecc8");
    grad.addColorStop(1, "#cdbf8c");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = "rgba(150,130,70,0.25)";
    ctx.lineWidth = 1;
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath();
      for (var i = 0; i <= SAMPLES; i++) {
        var t = i / SAMPLES;
        var p = edgeScaled(t, k * 0.33, 0.8);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStem() {
    var p = centerlinePoint(T_ATTACH);
    ctx.save();
    ctx.fillStyle = "#6b5b2a";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 12, 9, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.beginPath();
    ctx.ellipse(p.x - 3, p.y + 8, 3, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStrips() {
    for (var i = 0; i < strips.length; i++) {
      drawPeelStrip(strips[i]);
    }
  }

  function drawPeelStrip(strip) {
    if (strip.peeled && strip.peelAmount >= 1) {
      // still rendered, fully swung open, hanging beside the fruit
    } else if (strip.peeled) {
      return;
    }

    var pts = stripPolygon(strip);
    ctx.save();
    pathFromPoints(pts);

    // shade across the strip's width (not its length) so each strip reads as
    // a rounded sliver of peel catching light down its middle, dark at the rims
    var half = Math.floor(SAMPLES / 2);
    var leftMid = pts[half];
    var rightMid = pts[pts.length - 1 - half];
    var grad = ctx.createLinearGradient(leftMid.x, leftMid.y, rightMid.x, rightMid.y);
    var isOuter = strip.index === 0 || strip.index === strips.length - 1;
    if (isOuter) {
      grad.addColorStop(0, "#c79a14");
      grad.addColorStop(0.45, "#f3ce4c");
      grad.addColorStop(1, "#c79a14");
    } else {
      grad.addColorStop(0, "#dba81e");
      grad.addColorStop(0.45, "#fff2ab");
      grad.addColorStop(1, "#dba81e");
    }
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(90,65,5,0.4)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // center ridge line for texture
    ctx.beginPath();
    var mid = Math.floor(pts.length / 2);
    for (var i = 0; i <= SAMPLES; i++) {
      var a = pts[i];
      var b = pts[pts.length - 1 - i];
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      if (i === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
    }
    ctx.strokeStyle = "rgba(120,90,10,0.25)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  // ---- input wiring ----
  canvas.addEventListener("mousedown", onPointerDown);
  window.addEventListener("mousemove", onPointerMove);
  window.addEventListener("mouseup", onPointerUp);
  canvas.addEventListener("touchstart", onPointerDown, { passive: false });
  canvas.addEventListener("touchmove", onPointerMove, { passive: false });
  canvas.addEventListener("touchend", onPointerUp, { passive: false });
  canvas.addEventListener("touchcancel", onPointerUp, { passive: false });

  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
