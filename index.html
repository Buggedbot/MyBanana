<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Peel the Banana</title>
<style>
  :root {
    --peel: #ffd23f;
    --peel-deep: #f0a500;
    --ink: #0c140d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 28%, #2c2620 0%, #1a1612 55%, #0a0807 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    touch-action: none;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 520px;
    padding: 16px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }
  header { flex-wrap: wrap; row-gap: 6px; }
  header h1 {
    font-size: 1.05rem;
    margin: 0;
    letter-spacing: 0.4px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .stats {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill {
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(4px);
    white-space: nowrap;
    transition: transform 0.18s ease, background 0.18s ease;
    color: #fff;
    font-family: inherit;
  }
  .pill.bump { transform: scale(1.18); background: rgba(255,210,63,0.22); }
  button.pill { cursor: pointer; }
  .float-pt {
    position: absolute;
    z-index: 11;
    font-weight: 800;
    font-size: 1.05rem;
    color: #ffd23f;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
    15%  { opacity: 1; transform: translate(-50%, -14px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -64px) scale(1); }
  }
  #combo {
    position: absolute;
    z-index: 11;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 900;
    font-size: 1.4rem;
    color: #ff9a3d;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #combo.on { opacity: 1; }
  #combo.pop { animation: comboPop 0.3s ease; }
  @keyframes comboPop {
    0%   { transform: translateX(-50%) scale(1); }
    40%  { transform: translateX(-50%) scale(1.35); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #stage-wrap.shake #stage { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 5px); }
    40% { transform: translate(7px, -6px); }
    60% { transform: translate(-6px, -4px); }
    80% { transform: translate(5px, 3px); }
  }
  #collection {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(8,6,4,0.72);
    display: none;
    align-items: center;
    justify-content: center;
  }
  #collection.open { display: flex; }
  .col-card {
    background: #1c1712;
    border: 1px solid rgba(255,210,63,0.25);
    border-radius: 16px;
    padding: 18px 20px;
    width: min(86vw, 360px);
    max-height: 78vh;
    overflow-y: auto;
    box-shadow: 0 18px 50px rgba(0,0,0,0.6);
  }
  .col-card h2 { margin: 0 0 10px; font-size: 1.05rem; display: flex; justify-content: space-between; }
  .col-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.92rem;
  }
  .col-row.locked { opacity: 0.45; }
  .col-count { opacity: 0.75; }
  #col-close {
    margin-top: 14px;
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 0;
    background: #ffd23f;
    color: #231a05;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  #stage-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* soft glow behind the banana */
  #stage-wrap::before {
    content: "";
    position: absolute;
    width: 62%;
    height: 56%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,213,80,0.20), rgba(255,213,80,0) 70%);
    filter: blur(8px);
    pointer-events: none;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  #stage {
    position: relative;
    z-index: 1;
    touch-action: none;
    display: block;
    width: 100%;
    height: 100%;
  }
  #progress-bar {
    position: absolute;
    z-index: 6;
    bottom: 16px;
    left: 22px;
    right: 22px;
    height: 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.10);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 8px;
    background: linear-gradient(90deg, #ffe25a, #ff9a3d);
    box-shadow: 0 0 12px rgba(255,180,60,0.6);
    transition: width 0.28s cubic-bezier(.2,.8,.2,1);
  }
  #toast {
    position: absolute;
    z-index: 12;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    padding: 12px 22px;
    border-radius: 16px;
    background: rgba(26,20,14,0.88);
    border: 1px solid rgba(255,210,63,0.35);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--peel);
    opacity: 0;
    pointer-events: none;
    text-align: center;
    white-space: normal;
    max-width: 84%;
  }
  #toast.show {
    animation: pop 1.3s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
    18%  { opacity: 1; transform: translate(-50%,-58%) scale(1.08); }
    30%  { transform: translate(-50%,-58%) scale(1); }
    78%  { opacity: 1; transform: translate(-50%,-60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-74%) scale(0.96); }
  }
  #hint {
    position: absolute;
    z-index: 6;
    top: 6px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85rem;
    opacity: 0.7;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  footer {
    position: relative;
    z-index: 10;
    padding: 8px 0 16px;
    font-size: 0.76rem;
    opacity: 0.5;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍌 Peel the Banana</h1>
    <div class="stats">
      <span class="pill" id="timer">0.0s</span>
      <span class="pill" id="score">⭐ 0</span>
      <span class="pill" id="count">🍌 0</span>
      <span class="pill" id="best">⚡ --</span>
      <button class="pill" id="collect-btn">📖</button>
    </div>
  </header>
  <div id="stage-wrap">
    <div id="hint">Drag a peel to open it · drag the background to spin</div>
    <canvas id="stage"></canvas>
    <div id="toast"></div>
    <div id="combo"></div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>
  <footer>Peel fast to chain combos · collect all 17 rare bananas</footer>
  <div id="collection">
    <div class="col-card">
      <h2>📖 Collection <span id="col-progress"></span></h2>
      <div id="col-list"></div>
      <button id="col-close">Keep peeling</button>
    </div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var stageWrap = document.getElementById("stage-wrap");
  var timerEl = document.getElementById("timer");
  var countEl = document.getElementById("count");
  var bestEl = document.getElementById("best");
  var scoreEl = document.getElementById("score");
  var comboEl = document.getElementById("combo");
  var progressFill = document.getElementById("progress-fill");
  var toastEl = document.getElementById("toast");
  var hint = document.getElementById("hint");
  var collectBtn = document.getElementById("collect-btn");
  var collectionEl = document.getElementById("collection");
  var colListEl = document.getElementById("col-list");
  var colProgressEl = document.getElementById("col-progress");
  var colCloseEl = document.getElementById("col-close");

  var STRIP_COUNT = 4;
  var LENGTH = 3.6;
  var BASE_R = 0.6;
  var BOW = 0.58;
  var GAP_RAD = (4 * Math.PI) / 180;
  var STRIP_RADIAL = 12;       // strip cross-section segments
  var STRIP_SAMPLES = 26;      // strip lengthwise segments
  var RIDGE_AMP = 0.05;        // peel ridge depth (bananas are slightly square in section)
  var PEEL_FOLD = (140 * Math.PI) / 180;  // fold near the root at full peel
  var PEEL_CURL = (115 * Math.PI) / 180;  // extra curl accumulated toward the tip
  var PEEL_SNAP = 0.45;        // release past this and the peel finishes itself
  var PEEL_RANGE_PX = 120;     // drag distance (px) for a full peel
  var ROTATE_SPEED = 0.0065;
  var PEEL_EASE = 9;           // how snappily strips chase the drag target
  var AUTO_SPIN = 0.18;        // idle rotation (rad/s)
  var BOB_AMP = 0.06;
  var ENTER_DUR = 0.62;
  var EXIT_DUR = 0.5;
  var BASE_Y = 0;

  // ---- banana curve: t=0 is the root/stem (bottom), t=1 is the tip (top) ----
  function centerline(t) {
    return new THREE.Vector3(BOW * Math.sin(Math.PI * t), (t - 0.5) * LENGTH, 0);
  }
  function radiusAt(t) {
    // fuller through the middle, necking in toward the stem and tapering to the tip
    return BASE_R * (0.24 + 0.8 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.95)), 0.72));
  }
  function tangentAt(t) {
    var e = 0.01;
    var t0 = Math.max(0, t - e), t1 = Math.min(1, t + e);
    return centerline(t1).sub(centerline(t0)).normalize();
  }
  function frameAt(t) {
    var T = tangentAt(t);
    var N = new THREE.Vector3(-T.y, T.x, 0).normalize();
    var B = new THREE.Vector3(0, 0, 1);
    return { T: T, N: N, B: B };
  }

  function buildTubeGeometry(thetaStart, thetaEnd, radialSegs, samples, radiusScale) {
    var positions = [], indices = [], uvs = [];
    var cols = radialSegs + 1;
    var i, j;
    for (i = 0; i <= samples; i++) {
      var t = i / samples;
      var c = centerline(t), f = frameAt(t);
      var r = radiusAt(t) * radiusScale;
      for (j = 0; j <= radialSegs; j++) {
        var theta = thetaStart + (thetaEnd - thetaStart) * (j / radialSegs);
        var ct = Math.cos(theta), st = Math.sin(theta);
        positions.push(
          c.x + f.N.x * r * ct + f.B.x * r * st,
          c.y + f.N.y * r * ct + f.B.y * r * st,
          c.z + f.N.z * r * ct + f.B.z * r * st
        );
        uvs.push(j / radialSegs, t);
      }
    }
    for (i = 0; i < samples; i++) {
      for (j = 0; j < radialSegs; j++) {
        var a = i * cols + j, b = a + 1, cc = a + cols, d = cc + 1;
        indices.push(a, cc, b, b, cc, d);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  // closed outer+inner shell with end/side walls, so peel strips read as solid rather than paper-thin
  function buildSlabGeometry(thetaStart, thetaEnd, radialSegs, samples, outerScale, innerScale) {
    var positions = [], indices = [], uvs = [];
    var cols = radialSegs + 1;
    var i, j;

    function ring(radiusScale) {
      for (i = 0; i <= samples; i++) {
        var t = i / samples;
        var c = centerline(t), f = frameAt(t);
        var r = radiusAt(t) * radiusScale;
        for (j = 0; j <= radialSegs; j++) {
          var theta = thetaStart + (thetaEnd - thetaStart) * (j / radialSegs);
          var ct = Math.cos(theta), st = Math.sin(theta);
          var rr = r * (1 + RIDGE_AMP * Math.cos(4 * theta)); // raised ridges along the seams
          positions.push(
            c.x + f.N.x * rr * ct + f.B.x * rr * st,
            c.y + f.N.y * rr * ct + f.B.y * rr * st,
            c.z + f.N.z * rr * ct + f.B.z * rr * st
          );
          uvs.push(j / radialSegs, t);
        }
      }
    }
    function quad(a, b, cc, d) { indices.push(a, cc, b, b, cc, d); }

    ring(outerScale); // outer surface: vertex block 0
    ring(innerScale);  // inner surface: vertex block 1
    var outerBase = 0, innerBase = (samples + 1) * cols;

    // outer surface (facing out)
    for (i = 0; i < samples; i++) {
      for (j = 0; j < radialSegs; j++) {
        var a = outerBase + i * cols + j, b = a + 1, c2 = a + cols, d2 = c2 + 1;
        quad(a, b, c2, d2);
      }
    }
    // inner surface (facing in, so reverse winding)
    for (i = 0; i < samples; i++) {
      for (j = 0; j < radialSegs; j++) {
        var ai = innerBase + i * cols + j, bi = ai + 1, ci = ai + cols, di = ci + 1;
        quad(bi, ai, di, ci);
      }
    }
    // side walls along the strip's length, at theta = thetaStart and theta = thetaEnd
    for (i = 0; i < samples; i++) {
      var oA = outerBase + i * cols, oB = outerBase + (i + 1) * cols;
      var iA = innerBase + i * cols, iB = innerBase + (i + 1) * cols;
      quad(oA, iA, oB, iB); // thetaStart edge
      var oA2 = oA + radialSegs, oB2 = oB + radialSegs;
      var iA2 = iA + radialSegs, iB2 = iB + radialSegs;
      quad(iA2, oA2, iB2, oB2); // thetaEnd edge
    }
    // end caps at root (i=0) and tip (i=samples)
    for (j = 0; j < radialSegs; j++) {
      var rO = outerBase + j, rO2 = rO + 1, rI = innerBase + j, rI2 = rI + 1;
      quad(rI, rO, rI2, rO2); // root cap
      var tO = outerBase + samples * cols + j, tO2 = tO + 1;
      var tI = innerBase + samples * cols + j, tI2 = tI + 1;
      quad(tO, tI, tO2, tI2); // tip cap
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  // ---- renderer / scene ----
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0.1, 7.6);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xfff6e0, 0x2a2018, 0.9));
  var keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
  keyLight.position.set(3, 4, 5);
  scene.add(keyLight);
  var fillLight = new THREE.DirectionalLight(0xffe2a8, 0.35);
  fillLight.position.set(-3, -1, -2);
  scene.add(fillLight);
  var rimLight = new THREE.DirectionalLight(0xbfe0ff, 0.5);
  rimLight.position.set(-1, 2, -4);
  scene.add(rimLight);

  // ---- procedural textures + environment (built once, so no external files) ----
  function makeCanvas(s) { var c = document.createElement("canvas"); c.width = c.height = s; return c; }
  function canvasTex(c) {
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }

  // medal-style studio environment: alternating bright softbox stripes and dark
  // gaps, so polished metal picks up streaky light/dark bands and reads lustrous
  function buildEnvironment() {
    var c = makeCanvas(512), x = c.getContext("2d");
    var g = x.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0.0, "#e8e2d4"); g.addColorStop(0.45, "#8d8272");
    g.addColorStop(0.52, "#241f18"); g.addColorStop(1.0, "#060505");
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    // vertical softbox stripes at different azimuths; tilted slightly so the
    // bands sweep diagonally across the fruit like the reflections on a medal
    function stripe(cx, w, tilt, topA, botA) {
      var grad = x.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, "rgba(255,255,255," + topA + ")");
      grad.addColorStop(0.55, "rgba(255,252,244," + botA + ")");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      x.save(); x.translate(cx, 256); x.rotate(tilt); x.fillStyle = grad;
      x.fillRect(-w / 2, -256, w, 512); x.restore();
    }
    stripe(90, 46, 0.12, 1.0, 0.5);    // key softbox
    stripe(190, 18, -0.08, 0.95, 0.3); // thin crisp strip
    stripe(300, 60, 0.1, 0.85, 0.35);
    stripe(420, 26, -0.12, 1.0, 0.4);
    // dark slats between, for the deep bands that make metal look liquid
    x.fillStyle = "rgba(10,8,6,0.55)";
    x.fillRect(140, 0, 26, 512); x.fillRect(250, 0, 24, 512); x.fillRect(370, 0, 24, 512);
    var tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    var pmrem = new THREE.PMREMGenerator(renderer);
    var env = pmrem.fromEquirectangular(tex).texture;
    tex.dispose(); pmrem.dispose();
    return env;
  }

  // yellow peel with faint streaks and brown freckles
  function buildPeelTexture() {
    var c = makeCanvas(512), x = c.getContext("2d");
    var g = x.createLinearGradient(0, 0, 512, 0);
    g.addColorStop(0, "#e6b636"); g.addColorStop(0.5, "#ffd94b"); g.addColorStop(1, "#e6b636");
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    x.globalAlpha = 0.09; x.strokeStyle = "#8a6a12";
    for (var i = 0; i < 46; i++) {
      var xx = Math.random() * 512; x.lineWidth = 1 + Math.random() * 2;
      x.beginPath(); x.moveTo(xx, 0); x.lineTo(xx + (Math.random() * 24 - 12), 512); x.stroke();
    }
    x.globalAlpha = 1;
    for (var n = 0; n < 460; n++) {
      var fx = Math.random() * 512, fy = Math.random() * 512, r = Math.random() * 2.4 + 0.3;
      x.fillStyle = "rgba(" + (55 + Math.random() * 45 | 0) + "," + (38 + Math.random() * 26 | 0) + ",8," + (0.22 + Math.random() * 0.5).toFixed(2) + ")";
      x.beginPath(); x.arc(fx, fy, r, 0, 6.2832); x.fill();
    }
    var t = canvasTex(c); t.repeat.set(1, 2); return t;
  }

  // pale flesh with faint fibers and a line of seed specks
  function buildFleshTexture() {
    var c = makeCanvas(256), x = c.getContext("2d");
    x.fillStyle = "#f4e9c4"; x.fillRect(0, 0, 256, 256);
    x.globalAlpha = 0.14; x.strokeStyle = "#dcc891"; x.lineWidth = 2;
    for (var i = 0; i < 4; i++) { var xx = 60 + i * 46; x.beginPath(); x.moveTo(xx, 0); x.lineTo(xx, 256); x.stroke(); }
    x.globalAlpha = 1;
    for (var n = 0; n < 44; n++) {
      x.fillStyle = "rgba(60,45,25,0.5)";
      x.beginPath(); x.arc(128 + (Math.random() * 22 - 11), Math.random() * 256, 1.2, 0, 6.2832); x.fill();
    }
    return canvasTex(c);
  }

  // mottled bruising for the rotten tier: big dark patches with base showing between
  function buildRottenTexture() {
    var c = makeCanvas(256), x = c.getContext("2d");
    x.fillStyle = "#a88f47"; x.fillRect(0, 0, 256, 256);
    for (var n = 0; n < 26; n++) {
      var fx = Math.random() * 256, fy = Math.random() * 256, r = Math.random() * 26 + 10;
      var g = x.createRadialGradient(fx, fy, 0, fx, fy, r);
      g.addColorStop(0, "rgba(20,12,4,0.95)");
      g.addColorStop(0.7, "rgba(34,22,8,0.8)");
      g.addColorStop(1, "rgba(50,36,14,0)");
      x.fillStyle = g;
      x.save(); x.translate(fx, fy); x.scale(1, 0.55 + Math.random()); // squashed, organic
      x.beginPath(); x.arc(0, 0, r, 0, 6.2832); x.fill(); x.restore();
    }
    for (var m = 0; m < 130; m++) { // small freckles between the patches
      x.fillStyle = "rgba(45,30,10," + (0.3 + Math.random() * 0.4).toFixed(2) + ")";
      x.beginPath(); x.arc(Math.random() * 256, Math.random() * 256, Math.random() * 2.5 + 0.6, 0, 6.2832); x.fill();
    }
    return canvasTex(c);
  }

  // red explosive stick with a hazard-striped label band around the middle
  function buildTNTTexture() {
    var c = makeCanvas(256), x = c.getContext("2d");
    x.fillStyle = "#b81e15"; x.fillRect(0, 0, 256, 256);
    x.globalAlpha = 0.12; x.strokeStyle = "#000"; x.lineWidth = 2;
    for (var i = 0; i < 10; i++) { var xx = i * 26; x.beginPath(); x.moveTo(xx, 0); x.lineTo(xx, 256); x.stroke(); }
    x.globalAlpha = 1;
    x.fillStyle = "#ecdca8"; x.fillRect(0, 100, 256, 58);          // label band
    x.save(); x.beginPath(); x.rect(0, 100, 256, 58); x.clip();     // hazard stripes
    x.fillStyle = "#1a1a1a";
    for (var s = -2; s < 12; s++) {
      var bx = s * 34;
      x.beginPath(); x.moveTo(bx, 100); x.lineTo(bx + 16, 100);
      x.lineTo(bx + 16 + 58, 158); x.lineTo(bx + 58, 158); x.closePath(); x.fill();
    }
    x.restore();
    x.fillStyle = "#111"; x.font = "bold 30px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";

      x.lineWidth = 2 + Math.random() * 3;
      x.shadowColor = x.strokeStyle; x.shadowBlur = 8;
      x.beginPath(); x.moveTo(sx, sy);

    for (var m = 0; m < 40; m++) {

    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    x.strokeStyle = "rgba(255,255,255,0.85)"; x.lineWidth = 1;

  // 50/50: half of all bananas are rare, shared across tiers by weight so
  // higher-weight tiers (bronze, rotten, wooden…) come up more than the
  // ultra-rares (diamond, galaxy, rainbow…)
  var RARE_TOTAL = 0.5;
  var TOTAL_WEIGHT = RARITIES.reduce(function (sum, r) { return sum + r.weight; }, 0);
  RARITIES.forEach(function (r) { r.chance = RARE_TOTAL * r.weight / TOTAL_WEIGHT; });
  function pickRarity() {
    var r = Math.random(), acc = 0;
    for (var i = 0; i < RARITIES.length; i++) {
      acc += RARITIES[i].chance;
      if (r < acc) return RARITIES[i];
    }
    return null; // normal banana
  }

  // build the inner-fruit material from a core spec (physical for glass/chocolate)
  function makeCoreMaterial(rarity) {
    var d = rarity ? rarity.core : NORMAL_CORE;
    var opts = {
      color: d.color,
      roughness: d.roughness != null ? d.roughness : 0.5,
      metalness: d.metalness != null ? d.metalness : 0.0,
      emissive: d.emissive != null ? d.emissive : 0x000000,
      emissiveIntensity: d.emissiveIntensity != null ? d.emissiveIntensity : 0,
      envMapIntensity: d.envMapIntensity != null ? d.envMapIntensity : 1.0,
      side: THREE.DoubleSide
    };
    if (d.mapKind) opts.map = TEX[d.mapKind];
    // glowMap: the emissive follows the texture's bright spots (cracks, ooze,
    // stars) instead of uniformly washing out the whole fruit in one flat color
    if (d.glowMap && d.mapKind) opts.emissiveMap = TEX[d.mapKind];
    if (rarity && rarity.flat) opts.flatShading = true;
    if (d.physical) {
      if (d.transmission != null) opts.transmission = d.transmission;
      if (d.thickness != null) opts.thickness = d.thickness;
      if (d.ior != null) opts.ior = d.ior;
      if (d.clearcoat != null) opts.clearcoat = d.clearcoat;
      if (d.clearcoatRoughness != null) opts.clearcoatRoughness = d.clearcoatRoughness;
      return new THREE.MeshPhysicalMaterial(opts);
    }
    return new THREE.MeshStandardMaterial(opts);
  }

  // ---- banana factory: each banana owns its own meshes + materials ----
  function createBanana(rarity) {
    var group = new THREE.Group();
    group.rotation.set(0, 0.6, 0.12);

    var mats = [];
    function mat(opts) { var m = new THREE.MeshStandardMaterial(opts); mats.push(m); return m; }

    var coreMat = makeCoreMaterial(rarity);
    mats.push(coreMat);
    var stemMat = mat({ color: 0x6b5b2a, roughness: 0.7 });
    var tipMat = mat({ color: 0x55471d, roughness: 0.7 });

    group.add(new THREE.Mesh(buildTubeGeometry(0, Math.PI * 2, 36, 26, 0.84), coreMat));

    var root = centerline(0), tip = centerline(1), rf = frameAt(0);
    var negT0 = rf.T.clone().negate();

    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.15, 0.44, 10), stemMat);
    stem.position.copy(root).addScaledVector(negT0, 0.2);
    stem.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), negT0);
    group.add(stem);

    var stemCap = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), tipMat);
    stemCap.position.copy(root).addScaledVector(negT0, 0.42);
    group.add(stemCap);

    var tipMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), tipMat);
    tipMesh.position.copy(tip);
    tipMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), frameAt(1).T);
    tipMesh.scale.set(0.85, 1.5, 0.85);
    group.add(tipMesh);

    var strips = [];
    for (var i = 0; i < STRIP_COUNT; i++) {
      var thetaStart = -Math.PI + i * (Math.PI / 2);
      var thetaEnd = thetaStart + Math.PI / 2;
      var thetaC = (thetaStart + thetaEnd) / 2;

      var geo = buildSlabGeometry(thetaStart + GAP_RAD / 2, thetaEnd - GAP_RAD / 2, STRIP_RADIAL, STRIP_SAMPLES, 1.0, 0.86);
      geo.translate(-root.x, -root.y, -root.z);

      var stripMat = mat({
        map: TEX.peel, color: 0xffffff,
        roughness: 0.5, metalness: 0.04,
        emissive: 0x3a2c00, emissiveIntensity: 0.14,
        envMapIntensity: 0.5,
        side: THREE.DoubleSide
      });
      var mesh = new THREE.Mesh(geo, stripMat);
      mesh.frustumCulled = false; // vertices bend at runtime, so the static bounds lie

      var hinge = new THREE.Object3D();
      hinge.position.copy(root);
      hinge.add(mesh);
      group.add(hinge);

      var radial = rf.N.clone().multiplyScalar(Math.cos(thetaC)).addScaledVector(rf.B, Math.sin(thetaC));
      var axis = rf.T.clone().cross(radial).normalize();

      // spine point per lengthwise row, in the strip's local (root-relative) space
      var spine = [];
      for (var si = 0; si <= STRIP_SAMPLES; si++) {
        spine.push(centerline(si / STRIP_SAMPLES).sub(root));
      }

      strips.push({
        mesh: mesh, hinge: hinge, axis: axis, spine: spine,
        peel: 0, peelTarget: 0, peeled: false,
        basePos: geo.attributes.position.array.slice(0), lastPeel: -1
      });
    }

    mats.forEach(function (m) { m.transparent = true; });

    return {
      group: group, strips: strips, done: false, rarity: rarity, coreMat: coreMat,
      baseTiltZ: group.rotation.z, sparklePhase: Math.random() * 10,
      setOpacity: function (o) { mats.forEach(function (m) { m.opacity = o; }); },
      setScale: function (s) { group.scale.setScalar(s); },
      dispose: function () {
        group.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
        mats.forEach(function (m) { m.dispose(); });
        scene.remove(group);
      }
    };
  }

  // ---- particle burst on completion ----
  var PCOUNT = 44;
  var pPos = new Float32Array(PCOUNT * 3);
  var pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
  var pMat = new THREE.PointsMaterial({
    color: 0xffd23f, size: 0.16, transparent: true, opacity: 0, depthWrite: false
  });
  var points = new THREE.Points(pGeo, pMat);
  points.visible = false;
  scene.add(points);
  var pVel = [];
  var pLife = 0;
  var P_LIFE = 1.1;
  for (var pi = 0; pi < PCOUNT; pi++) pVel.push(new THREE.Vector3());

  function burst(center) {
    for (var i = 0; i < PCOUNT; i++) {
      pPos[i * 3] = center.x;
      pPos[i * 3 + 1] = center.y;
      pPos[i * 3 + 2] = center.z;
      var dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9 + 0.1, Math.random() - 0.5).normalize();
      pVel[i].copy(dir).multiplyScalar(1.6 + Math.random() * 1.8);
    }
    pLife = P_LIFE;
    points.visible = true;
    pMat.opacity = 1;
    pGeo.attributes.position.needsUpdate = true;
  }

  function updateParticles(dt) {
    if (pLife <= 0) return;

        current.coreMat.emissiveIntensity += base * 3.5 * flick;
      }
    }
    // rainbow banana cycles through the color wheel and breathes gently
    if (current.rarity && current.rarity.hueShift) {
      var hue = (now * 0.00012) % 1;
      current.coreMat.color.setHSL(hue, 0.65, 0.55);
      current.coreMat.emissive.setHSL((hue + 0.5) % 1, 0.85, 0.4);
      if (state === "playing") g.scale.setScalar(1 + 0.035 * Math.sin(now * 0.0032));
    }
    // lava crawls, toxic ooze bubbles up, candy stripes spin, galaxy drifts
    if (current.rarity && current.rarity.flow) {
      var tx = TEX[current.rarity.core.mapKind];
      if (tx) {
        tx.offset.x += current.rarity.flow.x * dt;
        tx.offset.y += current.rarity.flow.y * dt;
      }
    }
    // wooden banana creaks like it's about to topple over
    if (current.rarity && current.rarity.name === "wooden" && state === "playing") {
      g.rotation.z = current.baseTiltZ + Math.sin(now * 0.0022) * 0.035;
    }
    updateAmbient(dt, now);

    // combo chain expires if the next strip doesn't come in time
    if (combo > 0 && performance.now() - lastStripAt > COMBO_WINDOW) {
      combo = 0;
      comboEl.classList.remove("on");
    }

    if (state === "playing") {
      if (!drag) g.rotation.y += AUTO_SPIN * dt;           // gentle idle spin
      g.position.y = BASE_Y + Math.sin(now * 0.0018) * BOB_AMP;
      g.position.x = 0;
      if (started) {
        bananaElapsed = (now - bananaStart) / 1000;
        timerEl.textContent = bananaElapsed.toFixed(1) + "s";
      }
    } else if (state === "entering") {
      stateT = Math.min(1, stateT + dt / ENTER_DUR);
      current.setScale(easeOutBack(stateT));
      current.setOpacity(Math.min(1, stateT * 1.6));
      g.position.y = BASE_Y + (1 - easeOutCubic(stateT)) * 3.2;
      g.rotation.y += AUTO_SPIN * dt;
      if (stateT >= 1) { current.setScale(1); current.setOpacity(1); state = "playing"; }
    } else if (state === "exiting") {
      stateT = Math.min(1, stateT + dt / EXIT_DUR);
      var e = easeInCubic(stateT);
      current.setScale(1 - 0.25 * e);
      current.setOpacity(1 - e);
      g.position.y = BASE_Y - e * 5;
      g.rotation.y += (AUTO_SPIN + 0.6) * dt;
      if (stateT >= 1) spawnNext();
    }

    updateParticles(dt);
  }

  requestAnimationFrame(frame);
})();
</script>
