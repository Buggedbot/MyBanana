<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Peel the Banana</title>
<style>
  :root {
    --peel-yellow: #f3d34a;
    --peel-yellow-dark: #e0b923;
    --fruit-cream: #f5edcb;
    --bg-top: #1b2a1c;
    --bg-bottom: #0c140d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    touch-action: none;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 480px;
    padding: 14px 18px 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    box-sizing: border-box;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header .stats {
    font-size: 0.95rem;
    opacity: 0.85;
    display: flex;
    gap: 14px;
  }
  #stage-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    touch-action: none;
    display: block;
    width: 100%;
    height: 100%;
  }
  #progress-bar {
    position: absolute;
    bottom: 14px;
    left: 18px;
    right: 18px;
    height: 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd23f, #ff8a3d);
    transition: width 0.12s ease-out;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    z-index: 20;
  }
  #overlay.show { display: flex; }
  .card {
    background: #1f2e20;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 28px 26px;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 1.4rem;
  }
  .card p {
    opacity: 0.8;
    margin: 0 0 18px;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .card .big-stat {
    font-size: 2.4rem;
    font-weight: 700;
    margin: 4px 0 2px;
    color: var(--peel-yellow);
  }
  button {
    background: linear-gradient(135deg, #ffd23f, #ffb627);
    color: #2a2206;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(255, 178, 39, 0.35);
  }
  button:active { transform: scale(0.97); }
  footer {
    padding: 8px 0 16px;
    font-size: 0.78rem;
    opacity: 0.5;
    text-align: center;
  }
  #hint {
    position: absolute;
    top: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85rem;
    opacity: 0.7;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍌 Peel the Banana</h1>
    <div class="stats">
      <span id="timer">0.0s</span>
      <span id="best">Best: --</span>
    </div>
  </header>
  <div id="stage-wrap">
    <div id="hint">Drag a peel to open it · drag the background to spin</div>
    <canvas id="stage"></canvas>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="overlay">
      <div class="card" id="card">
        <h2 id="card-title">Banana Peeled!</h2>
        <div class="big-stat" id="card-time">0.0s</div>
        <p id="card-sub">Nice and clean. Ready for another?</p>
        <button id="restart-btn">Peel Another</button>
      </div>
    </div>
  </div>
  <footer>Tip: peel all 4 strips before time runs out</footer>
</div>
<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var stageWrap = document.getElementById("stage-wrap");
  var timerEl = document.getElementById("timer");
  var bestEl = document.getElementById("best");
  var progressFill = document.getElementById("progress-fill");
  var overlay = document.getElementById("overlay");
  var cardTitle = document.getElementById("card-title");
  var cardTime = document.getElementById("card-time");
  var cardSub = document.getElementById("card-sub");
  var restartBtn = document.getElementById("restart-btn");
  var hint = document.getElementById("hint");

  var TIME_LIMIT = 20; // seconds
  var STRIP_COUNT = 4;
  var LENGTH = 3.6;
  var BASE_R = 0.62;
  var BOW = 0.5;
  var GAP_RAD = (4 * Math.PI) / 180;
  var PEEL_ANGLE_MAX = (195 * Math.PI) / 180;
  var PEEL_RANGE_PX = 150; // total drag distance (px) for a full peel
  var ROTATE_SPEED = 0.0065;

  var strips = [];
  var drag = null;
  var startTime = 0;
  var elapsed = 0;
  var finished = false;
  var rafId = null;

  var best = null;
  try {
    var saved = localStorage.getItem("banana_best_time");
    if (saved) best = parseFloat(saved);
  } catch (e) {}
  updateBestLabel();

  // ---- banana curve: t=0 is the root/stem at the bottom, t=1 is the tip at the top ----
  function centerline(t) {
    return new THREE.Vector3(BOW * Math.sin(Math.PI * t), (t - 0.5) * LENGTH, 0);
  }
  function radiusAt(t) {
    return BASE_R * (0.3 + 0.7 * Math.sin(Math.PI * Math.pow(t, 0.92)));
  }
  function tangentAt(t) {
    var e = 0.01;
    var t0 = Math.max(0, t - e), t1 = Math.min(1, t + e);
    return centerline(t1).sub(centerline(t0)).normalize();
  }
  // cross-section frame: N bows with the curve (in-plane), B gives roundness (out-of-plane)
  function frameAt(t) {
    var T = tangentAt(t);
    var N = new THREE.Vector3(-T.y, T.x, 0).normalize();
    var B = new THREE.Vector3(0, 0, 1);
    return { T: T, N: N, B: B };
  }

  // builds a tube mesh geometry spanning theta [thetaStart, thetaEnd] over t in [0,1]
  function buildTubeGeometry(thetaStart, thetaEnd, radialSegs, samples, radiusScale) {
    var positions = [];
    var indices = [];
    var colsCount = radialSegs + 1;
    var i, j;
    for (i = 0; i <= samples; i++) {
      var t = i / samples;
      var c = centerline(t);
      var f = frameAt(t);
      var r = radiusAt(t) * radiusScale;
      for (j = 0; j <= radialSegs; j++) {
        var theta = thetaStart + (thetaEnd - thetaStart) * (j / radialSegs);
        var ct = Math.cos(theta), st = Math.sin(theta);
        positions.push(
          c.x + f.N.x * r * ct + f.B.x * r * st,
          c.y + f.N.y * r * ct + f.B.y * r * st,
          c.z + f.N.z * r * ct + f.B.z * r * st
        );
      }
    }
    for (i = 0; i < samples; i++) {
      for (j = 0; j < radialSegs; j++) {
        var a = i * colsCount + j;
        var b = a + 1;
        var c2 = a + colsCount;
        var d = c2 + 1;
        indices.push(a, c2, b);
        indices.push(b, c2, d);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  // ---- scene setup ----
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0.15, 7);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xfff4d6, 0x14210f, 0.95));
  var keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
  keyLight.position.set(2.4, 3, 4);
  scene.add(keyLight);
  var fillLight = new THREE.DirectionalLight(0xffe9b0, 0.35);
  fillLight.position.set(-3, -1, -2);
  scene.add(fillLight);

  var bananaGroup = new THREE.Group();
  bananaGroup.rotation.set(0, 0.6, 0.15);
  scene.add(bananaGroup);

  var coreMaterial = new THREE.MeshStandardMaterial({
    color: 0xf5edcb, roughness: 0.45, metalness: 0.04, side: THREE.DoubleSide
  });
  var stemMaterial = new THREE.MeshStandardMaterial({ color: 0x6b5b2a, roughness: 0.7 });
  var tipMaterial = new THREE.MeshStandardMaterial({ color: 0x5b4a1e, roughness: 0.7 });

  function buildScene() {
    var coreGeo = buildTubeGeometry(0, Math.PI * 2, 36, 26, 0.84);
    var coreMesh = new THREE.Mesh(coreGeo, coreMaterial);
    bananaGroup.add(coreMesh);

    var root = centerline(0);
    var tip = centerline(1);
    var rootFrame = frameAt(0);

    var stemGeo = new THREE.ConeGeometry(0.16, 0.36, 12);
    var stemMesh = new THREE.Mesh(stemGeo, stemMaterial);
    var negT0 = rootFrame.T.clone().negate();
    stemMesh.position.copy(root).addScaledVector(negT0, 0.16);
    stemMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), negT0);
    bananaGroup.add(stemMesh);

    var tipMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), tipMaterial);
    tipMesh.position.copy(tip);
    bananaGroup.add(tipMesh);

    strips = [];
    for (var i = 0; i < STRIP_COUNT; i++) {
      var thetaStart = -Math.PI + i * (Math.PI / 2);
      var thetaEnd = thetaStart + Math.PI / 2;
      var thetaC = (thetaStart + thetaEnd) / 2;

      var geo = buildTubeGeometry(
        thetaStart + GAP_RAD / 2, thetaEnd - GAP_RAD / 2, 12, 26, 1.0
      );
      geo.translate(-root.x, -root.y, -root.z);

      var isOuter = i === 0 || i === STRIP_COUNT - 1;
      var material = new THREE.MeshStandardMaterial({
        color: isOuter ? 0xf3ce4c : 0xfff2ab,
        roughness: 0.55,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
      var mesh = new THREE.Mesh(geo, material);

      var hinge = new THREE.Object3D();
      hinge.position.copy(root);
      hinge.add(mesh);
      bananaGroup.add(hinge);

      var radial = rootFrame.N.clone().multiplyScalar(Math.cos(thetaC))
        .addScaledVector(rootFrame.B, Math.sin(thetaC));
      var axis = rootFrame.T.clone().cross(radial).normalize();

      strips.push({
        index: i,
        mesh: mesh,
        hinge: hinge,
        axis: axis,
        peelAmount: 0,
        peeled: false,
        angleMax: PEEL_ANGLE_MAX
      });
    }
  }

  buildScene();

  // ---- interaction: drag a strip to peel it, drag elsewhere to spin the banana ----
  var raycaster = new THREE.Raycaster();

  function pointerInfo(evt) {
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (evt.touches && evt.touches.length) {
      clientX = evt.touches[0].clientX;
      clientY = evt.touches[0].clientY;
    } else if (evt.changedTouches && evt.changedTouches.length) {
      clientX = evt.changedTouches[0].clientX;
      clientY = evt.changedTouches[0].clientY;
    } else {
      clientX = evt.clientX;
      clientY = evt.clientY;
    }
    return {
      ndcX: ((clientX - rect.left) / rect.width) * 2 - 1,
      ndcY: -(((clientY - rect.top) / rect.height) * 2 - 1),
      px: clientX,
      py: clientY
    };
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function onPointerDown(evt) {
    if (finished) return;
    var p = pointerInfo(evt);
    raycaster.setFromCamera({ x: p.ndcX, y: p.ndcY }, camera);
    var targets = [];
    for (var i = 0; i < strips.length; i++) {
      if (!strips[i].peeled) targets.push(strips[i].mesh);
    }
    var hits = raycaster.intersectObjects(targets, false);
    if (hits.length) {
      var hitMesh = hits[0].object;
      var strip = null;
      for (var j = 0; j < strips.length; j++) {
        if (strips[j].mesh === hitMesh) { strip = strips[j]; break; }
      }
      drag = { mode: "peel", strip: strip, startX: p.px, startY: p.py, lastDist: 0 };
      hint.style.opacity = "0";
      if (!startTime) {
        startTime = performance.now();
        loop();
      }
    } else {
      drag = { mode: "rotate", lastX: p.px, lastY: p.py };
    }
    evt.preventDefault();
  }

  function onPointerMove(evt) {
    if (!drag || finished) return;
    var p = pointerInfo(evt);
    if (drag.mode === "peel") {
      var dx = p.px - drag.startX, dy = p.py - drag.startY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var delta = dist - drag.lastDist;
      drag.lastDist = dist;
      if (delta > 0) {
        var s = drag.strip;
        s.peelAmount = Math.min(1, s.peelAmount + delta / PEEL_RANGE_PX);
        s.hinge.quaternion.setFromAxisAngle(s.axis, s.peelAmount * s.angleMax);
        if (s.peelAmount >= 1 && !s.peeled) {
          s.peeled = true;
          checkComplete();
        }
      }
    } else {
      var ddx = p.px - drag.lastX, ddy = p.py - drag.lastY;
      bananaGroup.rotation.y += ddx * ROTATE_SPEED;
      bananaGroup.rotation.x = clamp(bananaGroup.rotation.x + ddy * ROTATE_SPEED, -1.1, 1.1);
      drag.lastX = p.px;
      drag.lastY = p.py;
    }
    evt.preventDefault();
  }

  function onPointerUp() { drag = null; }

  function checkComplete() {
    var allDone = strips.every(function (s) { return s.peeled; });
    if (allDone && !finished) {
      finished = true;
      var finalTime = elapsed;
      setTimeout(function () { showResult(finalTime, true); }, 220);
    }
  }

  function loop() {
    if (finished) return;
    elapsed = (performance.now() - startTime) / 1000;
    if (elapsed >= TIME_LIMIT) {
      finished = true;
      showResult(TIME_LIMIT, false);
      return;
    }
    timerEl.textContent = elapsed.toFixed(1) + "s";
    var totalProgress = strips.reduce(function (sum, s) { return sum + s.peelAmount; }, 0) / STRIP_COUNT;
    progressFill.style.width = (totalProgress * 100).toFixed(1) + "%";
    rafId = requestAnimationFrame(loop);
  }

  function showResult(time, success) {
    cancelAnimationFrame(rafId);
    timerEl.textContent = time.toFixed(1) + "s";
    if (success) {
      cardTitle.textContent = "Banana Peeled!";
      cardTime.textContent = time.toFixed(1) + "s";
      if (best === null || time < best) {
        best = time;
        try { localStorage.setItem("banana_best_time", String(best)); } catch (e) {}
        cardSub.textContent = "New best time!";
      } else {
        cardSub.textContent = "Nice and clean. Ready for another?";
      }
    } else {
      cardTitle.textContent = "Time's Up!";
      cardTime.textContent = Math.round(
        (strips.reduce(function (s, st) { return s + st.peelAmount; }, 0) / STRIP_COUNT) * 100
      ) + "%";
      cardSub.textContent = "That's how much you peeled. Try again?";
    }
    updateBestLabel();
    overlay.classList.add("show");
  }

  function updateBestLabel() {
    bestEl.textContent = "Best: " + (best !== null ? best.toFixed(1) + "s" : "--");
  }

  function resetGame() {
    finished = false;
    drag = null;
    startTime = 0;
    elapsed = 0;
    timerEl.textContent = "0.0s";
    progressFill.style.width = "0%";
    overlay.classList.remove("show");
    hint.style.opacity = "0.7";
    bananaGroup.rotation.set(0, 0.6, 0.15);
    strips.forEach(function (s) {
      s.peelAmount = 0;
      s.peeled = false;
      s.hinge.quaternion.identity();
    });
  }

  restartBtn.addEventListener("click", resetGame);

  // ---- input wiring ----
  canvas.addEventListener("mousedown", onPointerDown);
  window.addEventListener("mousemove", onPointerMove);
  window.addEventListener("mouseup", onPointerUp);
  canvas.addEventListener("touchstart", onPointerDown, { passive: false });
  canvas.addEventListener("touchmove", onPointerMove, { passive: false });
  canvas.addEventListener("touchend", onPointerUp, { passive: false });
  canvas.addEventListener("touchcancel", onPointerUp, { passive: false });

  function resize() {
    var rect = stageWrap.getBoundingClientRect();
    var w = Math.max(280, rect.width);
    var h = Math.max(360, rect.height);
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- render loop: always running so the user can spin the banana anytime ----
  function renderLoop() {
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
  }
  renderLoop();
})();
</script>
</body>
</html>
