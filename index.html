<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Peel the Banana</title>
<style>
  :root {
    --peel: #ffd23f;
    --peel-deep: #f0a500;
    --ink: #0c140d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 28%, #2c2620 0%, #1a1612 55%, #0a0807 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    touch-action: none;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 520px;
    padding: 16px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }
  header { flex-wrap: wrap; row-gap: 6px; }
  header h1 {
    font-size: 1.05rem;
    margin: 0;
    letter-spacing: 0.4px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  #logo {
    cursor: pointer;
    display: inline-block;
    transition: transform 0.12s ease;
  }
  #logo.tap { transform: scale(1.35) rotate(-12deg); }
  .stats {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill {
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(4px);
    white-space: nowrap;
    transition: transform 0.18s ease, background 0.18s ease;
    color: #fff;
    font-family: inherit;
    font-variant-numeric: tabular-nums; /* digits all the same width — no jitter */
    text-align: center;
  }
  /* fixed minimum widths so growing numbers never reflow (and flicker) the header */
  #timer { min-width: 64px; }
  #score { min-width: 82px; }
  #count { min-width: 58px; }
  #best  { min-width: 66px; }
  .pill.bump { transform: scale(1.18); background: rgba(255,210,63,0.22); }
  button.pill { cursor: pointer; }
  .float-pt {
    position: absolute;
    z-index: 11;
    font-weight: 800;
    font-size: 1.05rem;
    color: #ffd23f;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
    15%  { opacity: 1; transform: translate(-50%, -14px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -64px) scale(1); }
  }
  #combo {
    position: absolute;
    z-index: 11;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 900;
    font-size: 1.4rem;
    color: #ff9a3d;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #combo.on { opacity: 1; }
  #combo.pop { animation: comboPop 0.3s ease; }
  @keyframes comboPop {
    0%   { transform: translateX(-50%) scale(1); }
    40%  { transform: translateX(-50%) scale(1.35); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #stage-wrap.shake #stage { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 5px); }
    40% { transform: translate(7px, -6px); }
    60% { transform: translate(-6px, -4px); }
    80% { transform: translate(5px, 3px); }
  }
  #flash {
    position: absolute;
    z-index: 13;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.95), rgba(255,140,40,0.55) 40%, rgba(255,80,20,0) 72%);
    opacity: 0;
    pointer-events: none;
  }
  #flash.on { animation: flashPop 0.55s ease-out; }
  @keyframes flashPop {
    0%   { opacity: 0.95; }
    100% { opacity: 0; }
  }
  #collection {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(8,6,4,0.72);
    display: none;
    align-items: center;
    justify-content: center;
  }
  #collection.open { display: flex; }
  .col-card {
    background: #1c1712;
    border: 1px solid rgba(255,210,63,0.25);
    border-radius: 16px;
    padding: 18px 20px;
    width: min(86vw, 360px);
    max-height: 78vh;
    overflow-y: auto;
    box-shadow: 0 18px 50px rgba(0,0,0,0.6);
  }
  .col-card h2 { margin: 0 0 10px; font-size: 1.05rem; display: flex; justify-content: space-between; }
  .col-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.92rem;
  }
  .col-row.locked { opacity: 0.45; }
  .col-count { opacity: 0.75; }
  #col-close {
    margin-top: 14px;
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 0;
    background: #ffd23f;
    color: #231a05;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  #stage-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    --glow-rgb: 255,213,80; /* retinted to the rarity color once revealed */
  }
  /* soft glow behind the banana */
  #stage-wrap::before {
    content: "";
    position: absolute;
    width: 62%;
    height: 56%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--glow-rgb),0.22), rgba(var(--glow-rgb),0) 70%);
    filter: blur(8px);
    pointer-events: none;
    animation: breathe 5s ease-in-out infinite;
    transition: background 0.5s ease;
  }
  .zest {
    position: absolute;
    z-index: 9;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffe25a;
    box-shadow: 0 0 6px rgba(255,213,80,0.8);
    pointer-events: none;
    animation: zestFly 0.5s ease-out forwards;
  }
  @keyframes zestFly {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  #stage {
    position: relative;
    z-index: 1;
    touch-action: none;
    display: block;
    width: 100%;
    height: 100%;
  }
  #progress-bar {
    position: absolute;
    z-index: 6;
    bottom: 16px;
    left: 22px;
    right: 22px;
    height: 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.10);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 8px;
    background: linear-gradient(90deg, #ffe25a, #ff9a3d);
    box-shadow: 0 0 12px rgba(255,180,60,0.6);
    transition: width 0.28s cubic-bezier(.2,.8,.2,1);
  }
  #toast {
    position: absolute;
    z-index: 12;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    padding: 12px 22px;
    border-radius: 16px;
    background: rgba(26,20,14,0.88);
    border: 1px solid rgba(255,210,63,0.35);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--peel);
    opacity: 0;
    pointer-events: none;
    text-align: center;
    white-space: normal;
    max-width: 84%;
  }
  #toast.show {
    animation: pop 1.3s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
    18%  { opacity: 1; transform: translate(-50%,-58%) scale(1.08); }
    30%  { transform: translate(-50%,-58%) scale(1); }
    78%  { opacity: 1; transform: translate(-50%,-60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-74%) scale(0.96); }
  }
  #hint {
    position: absolute;
    z-index: 6;
    top: 6px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85rem;
    opacity: 0.7;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  footer {
    position: relative;
    z-index: 10;
    padding: 8px 0 16px;
    font-size: 0.76rem;
    opacity: 0.5;
    text-align: center;
  }
  /* eclipse banana: full-stage darkening during totality */
  #shade {
    position: absolute; inset: 0; background: #05040c; opacity: 0;
    transition: opacity 0.6s ease; pointer-events: none; z-index: 5;
  }
  /* eclipse banana: the draggable moon */
  #moon {
    position: absolute; left: 10%; top: 16%; font-size: 46px; z-index: 6;
    display: none; cursor: grab; user-select: none; -webkit-user-select: none;
    touch-action: none; filter: drop-shadow(0 0 10px rgba(120,140,255,0.55));
  }
  /* frog banana: the tongue flick, drawn from tip to pointer */
  #tongue {
    position: absolute; height: 6px; background: linear-gradient(90deg, #ff5a7a, #ff8ca0);
    border-radius: 4px; transform-origin: left center; z-index: 6;
    display: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span id="logo">🍌</span> Peel the Banana</h1>
    <div class="stats">
      <span class="pill" id="timer">0.0s</span>
      <span class="pill" id="score">⭐ 0</span>
      <span class="pill" id="count">🍌 0</span>
      <span class="pill" id="best">⚡ --</span>
      <button class="pill" id="collect-btn">📖</button>
    </div>
  </header>
  <div id="stage-wrap">
    <div id="hint">Drag a peel to open it · drag the background to spin</div>
    <canvas id="stage"></canvas>
    <div id="toast"></div>
    <div id="combo"></div>
    <div id="shade"></div>
    <div id="moon">🌑</div>
    <div id="tongue"></div>
    <div id="flash"></div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>
  <footer>Peel fast to chain combos · collect all 215 rare bananas</footer>
  <div id="collection">
    <div class="col-card">
      <h2>📖 Collection <span id="col-progress"></span></h2>
      <div id="col-list"></div>
      <button id="col-close">Keep peeling</button>
    </div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var stageWrap = document.getElementById("stage-wrap");
  var timerEl = document.getElementById("timer");
  var countEl = document.getElementById("count");
  var bestEl = document.getElementById("best");
  var scoreEl = document.getElementById("score");
  var comboEl = document.getElementById("combo");
  var flashEl = document.getElementById("flash");
  var progressFill = document.getElementById("progress-fill");
  var toastEl = document.getElementById("toast");
  var hint = document.getElementById("hint");
  var collectBtn = document.getElementById("collect-btn");
  var collectionEl = document.getElementById("collection");
  var colListEl = document.getElementById("col-list");
  var colProgressEl = document.getElementById("col-progress");
  var colCloseEl = document.getElementById("col-close");

  var STRIP_COUNT = 4;
  var LENGTH = 3.6;
  var BASE_R = 0.6;
  var BOW = 0.58;
  var GAP_RAD = (4 * Math.PI) / 180;
  var STRIP_RADIAL = 12;       // strip cross-section segments
  var STRIP_SAMPLES = 26;      // strip lengthwise segments
  var RIDGE_AMP = 0.05;        // peel ridge depth (bananas are slightly square in section)
  var PEEL_FOLD = (140 * Math.PI) / 180;  // fold near the root at full peel
  var PEEL_CURL = (115 * Math.PI) / 180;  // extra curl accumulated toward the tip
  var PEEL_SNAP = 0.45;        // release past this and the peel finishes itself
  var PEEL_RANGE_PX = 120;     // drag distance (px) for a full peel
  var ROTATE_SPEED = 0.0065;
  var PEEL_EASE = 9;           // how snappily strips chase the drag target
  var AUTO_SPIN = 0.18;        // idle rotation (rad/s)
  var BOB_AMP = 0.06;
  var ENTER_DUR = 0.62;
  var EXIT_DUR = 0.5;
  var BASE_Y = 0;

  // ---- banana curve: t=0 is the root/stem (bottom), t=1 is the tip (top) ----
  function centerline(t) {
    return new THREE.Vector3(BOW * Math.sin(Math.PI * t), (t - 0.5) * LENGTH, 0);
  }
  function radiusAt(t) {
    // fuller through the middle, necking in toward the stem and tapering to the tip
    return BASE_R * (0.24 + 0.8 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.95)), 0.72));
  }
  function tangentAt(t) {
    var e = 0.01;
    var t0 = Math.max(0, t - e), t1 = Math.min(1, t + e);
    return centerline(t1).sub(centerline(t0)).normalize();
  }
  function frameAt(t) {
    var T = tangentAt(t);
    var N = new THREE.Vector3(-T.y, T.x, 0).normalize();
    var B = new THREE.Vector3(0, 0, 1);
    return { T: T, N: N, B: B };
  }

  function buildTubeGeometry(thetaStart, thetaEnd, radialSegs, samples, radiusScale) {
    var positions = [], indices = [], uvs = [];
    var cols = radialSegs + 1;
    var i, j;
    for (i = 0; i <= samples; i++) {
      var t = i / samples;
      var c = centerline(t), f = frameAt(t);
      var r = radiusAt(t) * radiusScale;
      for (j = 0; j <= radialSegs; j++) {
        var theta = thetaStart + (thetaEnd - thetaStart) * (j / radialSegs);
        var ct = Math.cos(theta), st = Math.sin(theta);
        positions.push(
          c.x + f.N.x * r * ct + f.B.x * r * st,
          c.y + f.N.y * r * ct + f.B.y * r * st,
          c.z + f.N.z * r * ct + f.B.z * r * st
        );
        uvs.push(j / radialSegs, t);
      }
    }
    for (i = 0; i < samples; i++) {
      for (j = 0; j < radialSegs; j++) {
        var a = i * cols + j, b = a + 1, cc = a + cols, d = cc + 1;
        indices.push(a, cc, b, b, cc, d);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  // closed outer+inner shell with end/side walls, so peel strips read as solid rather than paper-thin
  function buildSlabGeometry(thetaStart, thetaEnd, radialSegs, samples, outerScale, innerScale) {
    var positions = [], indices = [], uvs = [];
    var cols = radialSegs + 1;
    var i, j;

    function ring(radiusScale) {
      for (i = 0; i <= samples; i++) {
        var t = i / samples;
        var c = centerline(t), f = frameAt(t);
        var r = radiusAt(t) * radiusScale;
        for (j = 0; j <= radialSegs; j++) {
          var theta = thetaStart + (thetaEnd - thetaStart) * (j / radialSegs);
          var ct = Math.cos(theta), st = Math.sin(theta);
          var rr = r * (1 + RIDGE_AMP * Math.cos(4 * theta)); // raised ridges along the seams
          positions.push(
            c.x + f.N.x * rr * ct + f.B.x * rr * st,
            c.y + f.N.y * rr * ct + f.B.y * rr * st,
            c.z + f.N.z * rr * ct + f.B.z * rr * st
          );
          uvs.push(j / radialSegs, t);
        }
      }
    }
    function quad(a, b, cc, d) { indices.push(a, cc, b, b, cc, d); }

    ring(outerScale); // outer surface: vertex block 0
    ring(innerScale);  // inner surface: vertex block 1
    var outerBase = 0, innerBase = (samples + 1) * cols;

    // outer surface (facing out)
    for (i = 0; i < samples; i++) {
      for (j = 0; j < radialSegs; j++) {
        var a = outerBase + i * cols + j, b = a + 1, c2 = a + cols, d2 = c2 + 1;
        quad(a, b, c2, d2);
      }
    }
    // inner surface (facing in, so reverse winding)
    for (i = 0; i < samples; i++) {
      for (j = 0; j < radialSegs; j++) {
        var ai = innerBase + i * cols + j, bi = ai + 1, ci = ai + cols, di = ci + 1;
        quad(bi, ai, di, ci);
      }
    }
    // side walls along the strip's length, at theta = thetaStart and theta = thetaEnd
    for (i = 0; i < samples; i++) {
      var oA = outerBase + i * cols, oB = outerBase + (i + 1) * cols;
      var iA = innerBase + i * cols, iB = innerBase + (i + 1) * cols;
      quad(oA, iA, oB, iB); // thetaStart edge
      var oA2 = oA + radialSegs, oB2 = oB + radialSegs;
      var iA2 = iA + radialSegs, iB2 = iB + radialSegs;
      quad(iA2, oA2, iB2, oB2); // thetaEnd edge
    }
    // end caps at root (i=0) and tip (i=samples)
    for (j = 0; j < radialSegs; j++) {
      var rO = outerBase + j, rO2 = rO + 1, rI = innerBase + j, rI2 = rI + 1;
      quad(rI, rO, rI2, rO2); // root cap
      var tO = outerBase + samples * cols + j, tO2 = tO + 1;
      var tI = innerBase + samples * cols + j, tI2 = tI + 1;
      quad(tO, tI, tO2, tI2); // tip cap
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  // ---- renderer / scene ----
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0.1, 7.6);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xfff6e0, 0x2a2018, 0.9));
  var keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
  keyLight.position.set(3, 4, 5);
  scene.add(keyLight);
  var fillLight = new THREE.DirectionalLight(0xffe2a8, 0.35);
  fillLight.position.set(-3, -1, -2);
  scene.add(fillLight);
  var rimLight = new THREE.DirectionalLight(0xbfe0ff, 0.5);
  rimLight.position.set(-1, 2, -4);
  scene.add(rimLight);

  // ---- procedural textures + environment (built once, so no external files) ----
  function makeCanvas(s) { var c = document.createElement("canvas"); c.width = c.height = s; return c; }
  function canvasTex(c) {
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }

  // medal-style studio environment: alternating bright softbox stripes and dark
  // gaps, so polished metal picks up streaky light/dark bands and reads lustrous
  function buildEnvironment() {
    var c = makeCanvas(512), x = c.getContext("2d");
    var g = x.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0.0, "#e8e2d4"); g.addColorStop(0.45, "#8d8272");
    g.addColorStop(0.52, "#241f18"); g.addColorStop(1.0, "#060505");
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    // vertical softbox stripes at different azimuths; tilted slightly so the
    // bands sweep diagonally across the fruit like the reflections on a medal
    function stripe(cx, w, tilt, topA, botA) {
      var grad = x.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, "rgba(255,255,255," + topA + ")");
      grad.addColorStop(0.55, "rgba(255,252,244," + botA + ")");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      x.save(); x.translate(cx, 256); x.rotate(tilt); x.fillStyle = grad;
      x.fillRect(-w / 2, -256, w, 512); x.restore();
    }
    stripe(90, 46, 0.12, 1.0, 0.5);    // key softbox
    stripe(190, 18, -0.08, 0.95, 0.3); // thin crisp strip
    stripe(300, 60, 0.1, 0.85, 0.35);
    stripe(420, 26, -0.12, 1.0, 0.4);
    // dark slats between, for the deep bands that make metal look liquid
    x.fillStyle = "rgba(10,8,6,0.55)";
    x.fillRect(140, 0, 26, 512); x.fillRect(250, 0, 24, 512); x.fillRect(370, 0, 24, 512);
    var tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    var pmrem = new THREE.PMREMGenerator(renderer);
    var env = pmrem.fromEquirectangular(tex).texture;
    tex.dispose(); pmrem.dispose();
    return env;
  }

  // yellow peel with faint streaks and brown freckles
  function buildPeelTexture() {
    var c = makeCanvas(512), x = c.getContext("2d");
    var g = x.createLinearGradient(0, 0, 512, 0);
    g.addColorStop(0, "#e6b636"); g.addColorStop(0.5, "#ffd94b"); g.addColorStop(1, "#e6b636");
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    x.globalAlpha = 0.09; x.strokeStyle = "#8a6a12";
    for (var i = 0; i < 46; i++) {
      var xx = Math.random() * 512; x.lineWidth = 1 + Math.random() * 2;
      x.beginPath(); x.moveTo(xx, 0); x.lineTo(xx + (Math.random() * 24 - 12), 512); x.stroke();
    }
    x.globalAlpha = 1;
    for (var n = 0; n < 460; n++) {
      var fx = Math.random() * 512, fy = Math.random() * 512, r = Math.random() * 2.4 + 0.3;

  function buildPixelTexture() {
    var c = makeCanvas(64), x = c.getContext("2d"); // low-res source, upscaled with hard edges
    // high-contrast retro palette (not shades of the normal peel's yellow,
    // or the hard block edges just read as a smooth gradient under lighting)
    var palette = ["#ff4136", "#ffdc00", "#2ecc40", "#0074d9", "#b10dc9", "#ff851b", "#f8f8f8", "#111111"];
    for (var py = 0; py < 16; py++) {

    var t = canvasTex(c);

    for (var i = 0; i < STRIP_COUNT; i++) {
      var thetaStart = -Math.PI + i * (Math.PI / 2);
      var thetaEnd = thetaStart + Math.PI / 2;

      var geo = buildSlabGeometry(thetaStart + GAP_RAD / 2, thetaEnd - GAP_RAD / 2, STRIP_RADIAL, STRIP_SAMPLES, 1.0, 0.86);
      geo.translate(-root.x, -root.y, -root.z);

      var stripMat = mat({
        map: puzzleNums ? PUZZLE_NUM_TEX[puzzleNums[i] - 1] : TEX.peel, color: 0xffffff,

      var spine = [];

    for (var i = 0; i < PCOUNT; i++) {

          playZip();
          if (tlen < 300) {
            fxu.flyCatches++;
            floatPoint("🪰 " + Math.min(fxu.flyCatches, 3) + "/3", thx, thy - 30);
            buzz(20);
          }
        }
        if (fxu.tongueHideAt && nowP > fxu.tongueHideAt) { tongueEl.style.display = "none"; fxu.tongueHideAt = 0; }
      }
    }
    // interactive-tier DOM overlays turn off the moment their tier is gone
    if (!current.rarity || !current.rarity.eclipseDrag) {
      if (moonEl.style.display === "block") { moonEl.style.display = "none"; shadeEl.style.opacity = "0"; }
    }
    if ((!current.rarity || !current.rarity.tongueSnap) && tongueEl.style.display === "block") tongueEl.style.display = "none";
    if (!current.rarity || !current.rarity.fireflySwarm) fireflyTarget = null;
    updateAmbient(dt, now);

    // combo chain expires if the next strip doesn't come in time — denim
    // shields the chain with a much wider window while it's the active banana,
    // and a phoenix's grace period pauses the countdown entirely
    var comboWindow = (current.rarity && current.rarity.comboShield) ? COMBO_WINDOW * 6 : COMBO_WINDOW;
    if (combo > 0 && performance.now() >= comboGraceUntil && performance.now() - lastStripAt > comboWindow) {
      combo = 0;
      comboEl.classList.remove("on");
    }

    if (state === "playing") {
      // disco spins like a mirror ball; marble is too heavy to spin fast;
      // sunflower ignores auto-spin and eases back to face the camera instead
      if (current.rarity && current.rarity.faceCamera) {
        if (!drag) g.rotation.y += (0 - g.rotation.y) * Math.min(1, 2.0 * dt);
      } else {
        var spin = (current.rarity && current.rarity.discoSpin) ? AUTO_SPIN * 5
          : (current.rarity && current.rarity.heavy) ? AUTO_SPIN * 0.35
          : (current.rarity && current.rarity.slowmo) ? AUTO_SPIN * 0.15 : AUTO_SPIN;
        if (!drag) g.rotation.y += spin * dt;
      }
      // the dream banana floats higher and bobs on bigger, slower swells;
      // chrono's bullet-time slows its bob to a crawl too
      var floaty = current.rarity && current.rarity.floaty;
      var bobRate = (current.rarity && current.rarity.slowmo) ? 0.0004 : 0.0018;
      g.position.y = BASE_Y + (floaty ? 0.35 : 0) + Math.sin(now * bobRate) * (floaty ? BOB_AMP * 3 : BOB_AMP);
      // the comet slowly falls, picking up speed the longer you take
      if (current.rarity && current.rarity.falling) {
        var fallT = (now - current.chargeStart) / 1000;
        g.position.y -= Math.min(2.2, 0.02 * fallT * fallT);
      }
      // the alien saucer's tractor beam lifts it up and sets it back down
      if (current.rarity && current.rarity.beam) {
        var beamPhase = (now % 4000) / 4000; // one lift every 4s
        var lift = beamPhase < 0.5 ? Math.sin(beamPhase * Math.PI) : 0;
        g.position.y += lift * 0.8;
      }
      g.position.x = 0;
      // ---- interactive-tier motion: slither, yo-yo drops, frog hops,
      // bell pendulum swings and ticklish wiggles ----
      var fxm = current.fx, rm = current.rarity;
      if (rm && fxm) {
        if (rm.slither) {
          // the whole body slithers in an S-wave — faster while grabbed
          var sSpd = drag && drag.mode === "peel" ? 0.009 : 0.0045;
          g.position.x += Math.sin(now * sSpd) * 0.09;
          g.rotation.z = current.baseTiltZ + Math.sin(now * sSpd * 1.6) * 0.06;
        }
        if (rm.yoyo) {
          fxm.yoyoV += (-26 * fxm.yoyoY - 2.2 * fxm.yoyoV) * dt;
          fxm.yoyoY += fxm.yoyoV * dt;
          g.position.y += fxm.yoyoY;
        }
        if (rm.tongueSnap && (fxm.hopY > 0 || fxm.hopV > 0)) {
          fxm.hopV -= 12 * dt;
          fxm.hopY = Math.max(0, fxm.hopY + fxm.hopV * dt);
          if (fxm.hopY === 0) fxm.hopV = 0;
          g.position.y += fxm.hopY;
        }
        if (rm.pendulumRing) {
          fxm.swingV += (-6.5 * fxm.swing) * dt;
          fxm.swingV *= Math.max(0, 1 - 0.9 * dt);
          fxm.swing = clamp(fxm.swing + fxm.swingV * dt, -0.75, 0.75);
          g.rotation.z = current.baseTiltZ + fxm.swing;
          // it rings at each swing peak, louder with amplitude
          if (fxm.lastSwingV * fxm.swingV < 0 && Math.abs(fxm.swing) > 0.11) {
            playBell(Math.abs(fxm.swing));
            buzz(Math.abs(fxm.swing) * 60 | 0);
            if (Math.abs(fxm.swing) > 0.34 && !fxm.rungHard) { fxm.rungHard = true; showToast("🔔 Rung true! Bonus earned"); }
          }
          fxm.lastSwingV = fxm.swingV;
        }
        if (rm.tickle && fxm.gig > 0.05) {
          g.rotation.z = current.baseTiltZ + Math.sin(now * 0.03) * 0.07 * fxm.gig;
        }
      }
      // jelly wobble (squash one axis, stretch the others) on grabs and tears,
      // layered over slow breathing (rainbow subtle, bubblegum chewy) —
      // marble is heavy stone and settles out of any jiggle fast
      wobbleT += dt;
      // slime is gooey: its jiggle is huge and takes ages to settle; heavy tiers settle instantly
      var settleRate = (current.rarity && current.rarity.heavy) ? 12 : (current.rarity && current.rarity.gooey) ? 1.6 : 5;
      wobbleAmp *= Math.exp(-settleRate * dt);
      var breathe = 1;
      if (current.rarity && current.rarity.breatheAmp) breathe = 1 + current.rarity.breatheAmp * Math.sin(now * 0.0024);
      else if (current.rarity && current.rarity.hueShift) breathe = 1 + 0.035 * Math.sin(now * 0.0032);
      // balloon slowly inflates the longer it sits unpeeled
      if (current.rarity && current.rarity.inflate) {
        breathe *= 1 + Math.min(0.5, (now - current.chargeStart) / 6000 * 0.5);
      }
      // turtle tucks into its shell; pufferfish swells while held
      if (current.fx && current.fx.squishMul !== 1) breathe *= current.fx.squishMul;
      var gooScale = (current.rarity && current.rarity.gooey) ? 2.4 : 1;
      var w = wobbleAmp * Math.sin(wobbleT * (current.rarity && current.rarity.gooey ? 9 : 16)) * gooScale;
      var bs = current.baseScale;
      g.scale.set(bs * breathe * (1 + 0.05 * w), bs * breathe * (1 - 0.07 * w), bs * breathe * (1 + 0.05 * w));
      if (started) {
        bananaElapsed = (now - bananaStart) / 1000;
        timerEl.textContent = bananaElapsed.toFixed(1) + "s";
      }
    } else if (state === "entering") {
      stateT = Math.min(1, stateT + dt / ENTER_DUR);
      current.setScale(easeOutBack(stateT));
      current.setOpacity(Math.min(1, stateT * 1.6));
      g.position.y = BASE_Y + (1 - easeOutCubic(stateT)) * 3.2;
      g.rotation.y += AUTO_SPIN * dt;
      if (stateT >= 1) { current.setScale(1); current.setOpacity(1); state = "playing"; }
    } else if (state === "exiting") {
      stateT = Math.min(1, stateT + dt / EXIT_DUR);
      var e = easeInCubic(stateT);
      current.setScale(1 - 0.25 * e);
      current.setOpacity(1 - e);
      g.position.y = BASE_Y - e * 5;
      g.rotation.y += (AUTO_SPIN + 0.6) * dt;
      if (stateT >= 1) spawnNext();
    }

    updateParticles(dt);
    updateShockwave(dt);
  }

  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
